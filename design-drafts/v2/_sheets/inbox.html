<h1>收件箱 · 三版对比 <a href="../index.html">← 返回选型页</a></h1>
<div class="row"><figure><img src="../previews/inbox-a.png" alt="inbox-a" /><figcaption><b>inbox-a</b><br />收件箱 · 变体 A「处理台」（INBOX · PROCESSING DESK） · 概念：左右分栏 —— 左侧未澄清紧凑列表（序号 + 来源 + 摘要 + 时间），右侧为选中条目详情 + 澄清操作区 + 处理进度；单条聚焦、键盘流处理。 · 关键差异：三版中唯一双栏「列表 ↔ 详情」结构，一次处理一条；B 为单列卡片流（每条自带完整澄清），C 为按日期分组的批量浏览 + 多选。 · 移动端：&lt; 1024px 折叠为单列 —— 列表在上，选中条目详情以全宽面板紧随其下。</figcaption></figure>
<figure><img src="../previews/inbox-b.png" alt="inbox-b" /><figcaption><b>inbox-b</b><br />收件箱 · 变体 B「卡片流」（INBOX · CARD STREAM） · 概念：单列卡片流 —— 捕捉条在下、水位并入一条安静细带；每条未澄清为一张卡片，内容为标题、元信息为副行、底部完整澄清操作行，间距更松、层级更清晰。 · 关键差异：不分区、不分栏，六条平权；A 用双栏聚焦单条，C 用分组 + 多选批量处理。 · 移动端：单列天然适配，卡片内边距与澄清按钮自动收窄为一行两列换行。</figcaption></figure>
<figure><img src="../previews/inbox-c.png" alt="inbox-c" /><figcaption><b>inbox-c</b><br />收件箱 · 变体 C「批量」（INBOX · BATCH） · 概念：分组浏览 —— 按捕捉日期分组（今天 / 昨天），行内置 .k-check 多选；顶部批量操作条（批量澄清 / 批量丢弃）统一处理，单条澄清仍可从行尾入口展开。 · 关键差异：唯一支持多选与批量动作的版本，密度最高；A 为双栏单条聚焦，B 为单列卡片流逐条处理。 · 移动端：批量条换行为两行，分组与行保持单列；勾选框与行尾入口缩小但仍可点。</figcaption></figure></div>
</div></body></html>

<h1>设置 · 三版对比 <a href="../index.html">← 返回选型页</a></h1>
<div class="row"><figure><img src="../previews/settings-a.png" alt="settings-a" /><figcaption><b>settings-a</b><br />变体代号：SETTINGS-A「卡片组」 · 一句话概念：现有分组卡片的精化——五张同构卡片（主题 / AI 集成 / 数据统计 / · 数据服务 / 关于）在响应式两栏「类瀑布」网格中有节奏地排布，卡片一律对齐顶端。 · 关键差异：A 是宽屏两栏卡组，可一次纵览全部设置；B 是左分类导航 + 右单区面板； · C 是单列长表单流（~760px，靠分隔线分区）。 · 移动端行为设想：900px 以下并为一栏，卡片按「主题 → AI → 数据统计 → 数据服务 → 关于」顺序堆叠。</figcaption></figure>
<figure><img src="../previews/settings-b.png" alt="settings-b" /><figcaption><b>settings-b</b><br />变体代号：SETTINGS-B「侧导航」 · 一句话概念：左侧竖排分类导航（外观 / AI / 数据 / 关于，静态、外观选中）+ 右侧单区 · 内容面板；当前展示「外观」区（主题切换，暗色为当前态），下方带出「数据统计」预览。 · 关键差异：B 是设置应用式的「导航 + 单面板」结构（分类聚焦、可扩展）；A 是宽屏两栏卡组； · C 是单列长表单流。B 最像成熟设置中心。 · 移动端行为设想：900px 以下左导航变横向可滚动标签条置顶，右面板占满整宽。</figcaption></figure>
<figure><img src="../previews/settings-c.png" alt="settings-c" /><figcaption><b>settings-c</b><br />变体代号：SETTINGS-C「单列流」 · 一句话概念：一条居中约 760px 的长表单流，分区自上而下（外观 / AI 集成 / 数据统计 / · 数据服务 / 关于），每区以标题 + 英文小标签开头、以细分隔线区隔，安静、可扫读。 · 关键差异：C 是单列长表单（阅读顺序唯一、最安静）；A 是宽屏两栏卡组（一次纵览）； · B 是左导航 + 右单面板（分类聚焦）。 · 移动端行为设想：760px 阅读栏在窄屏满宽，表格纵向滚动，分隔线节奏不变。</figcaption></figure></div>
</div></body></html>

<h1>日程 · 三版对比 <a href="../index.html">← 返回选型页</a></h1>
<div class="row"><figure><img src="../previews/calendar-a.png" alt="calendar-a" /><figcaption><b>calendar-a</b><br />日程 CALENDAR · 变体 A「日视图」 · 概念：现有「日脊 + 议程」骨架的精化——日期条建立层级、周条紧凑化提高信息密度， · 左侧日脊以 08:00–23:00 窗口按真实时间落位（含 16:20 现在线）， · 右侧议程拆成「今天 / 接下来」两段，补足上下文。 · 关键差异： · 相比 B（周视图 · 7 列课表），A 是单日纵深时间轴 + 侧栏议程，回答「今天怎么过」； · 相比 C（议程流 + 迷你月历），A 以时间几何为主视觉，强调现在位置与日内疏密。 · 移动端设想：日脊与议程塌陷为单列（日脊优先，议程随后），周条收成 7 个窄卡横向滚动。 · 数据说明：今天 = 2</figcaption></figure>
<figure><img src="../previews/calendar-b.png" alt="calendar-b" /><figcaption><b>calendar-b</b><br />日程 CALENDAR · 变体 B「周视图」 · 概念：7 列 × 08:00–22:00 时间网格，按课表方式铺排一周事件；今天列轻微抬亮， · 顶部全天条 + 左侧时间刻度，侧栏放迷你月历与「本周」快速导航。 · 关键差异： · 相比 A（单日日脊 + 议程），B 是横向一周全景，回答「这一周怎么排」； · 相比 C（纵向议程流 + 迷你月历），B 保留时间几何（小时线 / 块高）， · 并真实呈现 10-03 周六「训练赛 19:00–22:00 ∩ KERNEL 冲刺 20:00–22:00」的重叠并置。 · 移动端设想：网格横向滚动或按天折叠；侧栏（月历 / 本周）落到主区下方单列</figcaption></figure>
<figure><img src="../previews/calendar-c.png" alt="calendar-c" /><figcaption><b>calendar-c</b><br />日程 CALENDAR · 变体 C「议程流」 · 概念：以「接下来」为主线的纵向事件流——顶部高亮下一项，正文按 · 今天 / 明天 / 本周 / 下周 / 稍后 分组，每行「时间 · 标题 · 地点」； · 右侧迷你月历（10 月，今天标记）+ 分布图例。整体偏移动端阅读节奏。 · 关键差异： · 相比 A（单日日脊 + 议程），C 不画时间几何，改用可无限增长的列表流； · 相比 B（一周横向课表），C 是纵向时间线，跨天连续、天然适配窄屏。 · 移动端设想：单列即可成立——下一项卡 → 事件流 → 迷你月历顺次堆叠（侧栏取消吸顶）。 · 数据说明：今天 = 2026-10-02（周五）</figcaption></figure></div>
</div></body></html>

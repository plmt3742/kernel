<figure><img src="../previews/overview-c.png" alt="overview-c" /><figcaption><b>overview-c</b><br />变体 C · overview-c.html「工作台 WORKBENCH」（总览第三轮 R3-C） · 概念：左 2/3「工作区」——下一步行动 TOP5（完整 meta）与今日日程条目按时间穿插在同一列（课程 → 现在 → 按截止排序的行动）； · 右 1/3「监视柱」——垂直监控栈：水位 / WIP / 连续刷题 / 完成趋势 / 到期负载，各一小块，随时可瞥； · 顶部仅一条窄状态行（胶囊），底部一行项目推进条。功能分区最清晰，图表全部收进右侧窄柱。 · 与另两版差异：A 是单条今日时间线做叙事 + 瓦片内嵌微型图；B 以顶部横向仪表带为锚、趋势带置底； · C 既不画时间线也不铺仪表带</figcaption></figure></div>

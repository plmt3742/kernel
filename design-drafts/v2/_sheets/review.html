<h1>回顾 · 三版对比 <a href="../index.html">← 返回选型页</a></h1>
<div class="row"><figure><img src="../previews/review-a.png" alt="review-a" /><figcaption><b>review-a</b><br />变体代号：REVIEW-A「叙事」 · 一句话概念：把回顾当周记——一条收窄到 ~760px 的阅读流，周期头 / 摘要 / 编号决策 / · 内嵌数字散文 / 图表 / 停滞清单，纵向推进，安静编辑感。 · 关键差异：A 单列阅读流（无分栏、无卡片堆叠，靠度量与分隔线组织）； · B 是双栏仪表盘（左指标+图 / 右卡片+清单）；C 是顶部步骤条向导。 · 移动端行为设想：阅读栏自然收窄至满宽，图表两列降为单列，字号随流体 token 缩小。</figcaption></figure>
<figure><img src="../previews/review-b.png" alt="review-b" /><figcaption><b>review-b</b><br />变体代号：REVIEW-B「仪表盘」 · 一句话概念：双栏数据密集——左栏 5 枚指标瓦片 + 本周完成柱图 + 能量分布； · 右栏周/月回顾卡（含编号决策）+ 停滞清单 + 主 CTA，一眼看全周期。 · 关键差异：B 是左右双栏仪表盘（信息密度最高、扫读最快）；A 是单列周记阅读流； · C 是顶部步骤条向导（流程感、聚焦单步）。 · 移动端行为设想：1100px 以下双栏并为单栏（左栏在上、右栏在下），指标瓦片 5→3→2 列。</figcaption></figure>
<figure><img src="../previews/review-c.png" alt="review-c" /><figcaption><b>review-c</b><br />变体代号：REVIEW-C「向导」 · 一句话概念：顶部 5 段步骤条（01 概览 → 05 定稿，当前停在第 02 步「清空收件箱」）， · 主体只呈现当前步的内容（收件箱水位 + 相关指标 + 本步清单），右侧常驻迷你摘要。 · 关键差异：C 是流程导向的向导（一次只做一步、步骤条领航）；A 是单列周记阅读； · B 是双栏仪表盘（一次看全）。C 信息聚焦度最高、仪式感最强。 · 移动端行为设想：步骤条由 5 列折为 2 列换行，右侧迷你摘要落到主体下方（取消 sticky）。</figcaption></figure></div>

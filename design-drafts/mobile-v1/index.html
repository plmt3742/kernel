<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <title>KERNEL · 移动端设计稿</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="backButton" aria-label="返回" hidden>←</button>
      <div class="brand-block">
        <span class="eyebrow" id="pageEyebrow">KERNEL / TODAY</span>
        <h1 id="pageTitle">总览</h1>
      </div>
      <button class="icon-btn" id="quickButton" aria-label="快速捕捉">＋</button>
    </header>

    <main id="app" tabindex="-1"></main>

    <button class="nav-orb nav-zone" id="navOrb" aria-label="按住右侧导航区域" aria-expanded="false" aria-controls="mainNavigation">
      <span class="nav-zone-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="sr-only">右侧导航热区</span>
    </button>
    <nav class="tabbar is-collapsed" id="mainNavigation" aria-label="主要导航" aria-hidden="true">
      <button data-route="overview" aria-label="总览"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></span><b>总览</b><i></i></button>
      <button data-route="inbox" aria-label="收件箱"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v12H4zM4 14h4l1.6 2h4.8l1.6-2h4"/></svg></span><b>收件箱</b><i></i></button>
      <button data-route="tasks" aria-label="任务"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.2 2.2 4.9-5"/></svg></span><b>任务</b><i></i></button>
      <button data-route="calendar" aria-label="日程"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14v13H5zM8 4v4M16 4v4M5 10h14"/><path d="M8 13h2M14 13h2M8 16h2M14 16h2"/></svg></span><b>日程</b><i></i></button>
      <button id="moreButton" aria-label="更多页面"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="7" r="1.5"/><circle cx="17" cy="7" r="1.5"/><circle cx="7" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/></svg></span><b>更多</b><i></i></button>
    </nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="moreSheet" role="dialog" aria-modal="true" aria-labelledby="moreTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div><span class="eyebrow">ALL SPACES</span><h2 id="moreTitle">更多空间</h2></div><button class="icon-btn" data-close aria-label="关闭">×</button></div>
    <div class="more-grid" id="moreGrid"></div>
  </section>
  <section class="sheet capture-sheet" id="captureSheet" role="dialog" aria-modal="true" aria-labelledby="captureTitle" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head"><div><span class="eyebrow">QUICK CAPTURE</span><h2 id="captureTitle">先记下来</h2></div><button class="icon-btn" data-close aria-label="关闭">×</button></div>
    <label class="sr-only" for="captureInput">捕捉内容</label>
    <textarea id="captureInput" placeholder="任务、想法、链接或一句备忘…"></textarea>
    <div class="chip-row"><button class="chip is-active">文本</button><button class="chip">拍照</button><button class="chip">文件</button><button class="chip">语音</button></div>
    <button class="primary wide" id="captureSave">存入收件箱</button>
  </section>
  <section class="sheet detail-sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
    <div class="sheet-handle"></div><div id="detailContent"></div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>

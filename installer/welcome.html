<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="KERNEL 启动中 · 本地优先的个人事务内核">
<title>KERNEL · 启动中</title>
<style>
/* =============================================================================
 * KERNEL · 启动页（自包含单文件）
 * 双击「启动.cmd」后浏览器首先看到本页：等待本机应用就绪，就绪后自动进入。
 * token 与 public/guide.html / src/styles/tokens.css 同源（柔暗夜色 · 柔影悬浮 · 圆角 16 ·
 * 强调色仅作信号）。零外部请求：字体用系统栈，无外链、无 CDN、无图标字体、无 eval。
 * ========================================================================== */
:root {
  /* 表面阶 */
  --bg: #0f0f10;
  --surface: #1a1a1c;
  --surface-elevated: #212124;
  --surface-hover: #232327;
  --surface-sunken: #141416;

  /* 文字 */
  --ink: #f4f4f5;
  --ink-2: #a1a1aa;
  --muted: #929298;

  /* 边缘 / 填充 */
  --outline: rgba(255, 255, 255, 0.06);
  --outline-strong: rgba(255, 255, 255, 0.12);
  --rule-soft: rgba(255, 255, 255, 0.06);
  --fill-subtle: rgba(255, 255, 255, 0.05);
  --fill-secondary: rgba(255, 255, 255, 0.08);

  /* 强调色：仅信号 / 焦点 / 激活 */
  --accent: #ff5a52;
  --accent-ink: #0f0f10;

  /* 语义色（克制，必伴随文字） */
  --success: #4caf7d;
  --warning: #d08a2b;

  /* 柔影悬浮 */
  --shadow-card: 0 16px 40px rgba(0, 0, 0, 0.45);
  --shadow-hover: 0 22px 54px rgba(0, 0, 0, 0.55);
  --shadow-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --focus-ring: rgba(244, 244, 245, 0.55);

  /* 字体（自包含：系统字体栈 + 等宽回退，含 CJK） */
  --font-sans: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Cascadia Code", monospace;

  /* 字号（镜像 tokens.css 流体锚点 390→1440） */
  --text-micro: 11px;
  --text-caption: clamp(11.5px, calc(11.314px + 0.0476vw), 12px);
  --text-body-sm: clamp(12.4px, calc(12.177px + 0.0571vw), 13px);
  --text-body: clamp(14.4px, calc(14.177px + 0.0571vw), 15px);
  --text-h4: clamp(17px, calc(16.629px + 0.0952vw), 18px);

  /* 间距（4px 基线） */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: clamp(20px, calc(18.514px + 0.381vw), 24px);
  --space-6: clamp(26px, calc(23.771px + 0.5714vw), 32px);
  --space-7: clamp(38px, calc(34.286px + 0.9524vw), 48px);

  /* 形状 / 动效 */
  --radius-card: 16px;
  --radius-inner: 11px;
  --radius-pill: 999px;
  --dur-fast: 180ms;
  --dur-base: 240ms;
  --ease-standard: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  background-color: var(--bg);
  background-image: radial-gradient(900px 460px at 50% -12%, rgba(255, 90, 82, 0.045), transparent 62%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: 1.65;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 6px; }
:focus:not(:focus-visible) { outline: none; }

::selection { background: rgba(244, 244, 245, 0.18); }

/* -------------------------------------------------------------------------- */
/* 骨架                                                                      */
/* -------------------------------------------------------------------------- */

.wrap {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: clamp(20px, 4vw, 48px);
}

.card {
  width: min(448px, 100%);
  background: var(--surface);
  border: 1px solid var(--outline);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card), var(--shadow-highlight);
  padding: var(--space-7) var(--space-6) var(--space-6);
  animation: rise var(--dur-base) var(--ease-enter) both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* -------------------------------------------------------------------------- */
/* 品牌                                                                      */
/* -------------------------------------------------------------------------- */

.brand { display: flex; align-items: center; gap: var(--space-3); }

.mark {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-inner);
  background: var(--surface-elevated);
  border: 1px solid var(--outline-strong);
  box-shadow: var(--shadow-highlight);
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--ink);
}

.brand__text { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.brand__name { font-size: var(--text-h4); font-weight: 600; letter-spacing: 0.06em; }
.brand__ver { font-size: var(--text-micro); color: var(--muted); letter-spacing: 0.04em; }

.tagline { margin-top: var(--space-3); font-size: var(--text-body-sm); color: var(--ink-2); }

/* -------------------------------------------------------------------------- */
/* 状态                                                                      */
/* -------------------------------------------------------------------------- */

.status { margin-top: var(--space-6); }

.status__head { display: flex; align-items: center; gap: var(--space-3); min-height: 22px; }

.pulse { position: relative; flex: 0 0 auto; width: 11px; height: 11px; }
.pulse__core {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--accent);
  transition: background var(--dur-base) var(--ease-standard);
}
.pulse::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.9s var(--ease-standard) infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.5; }
  100% { transform: scale(2.6); opacity: 0; }
}

body[data-state="ready"] .pulse__core,
body[data-state="ready"] .pulse::after { background: var(--success); }
body[data-state="timeout"] .pulse__core,
body[data-state="timeout"] .pulse::after { background: var(--warning); }
body[data-state="ready"] .pulse::after { animation: none; opacity: 0; }
body[data-state="timeout"] .pulse::after { animation: none; opacity: 0; }

.status__text { font-size: var(--text-body); color: var(--ink); }
.status__hint { margin-top: var(--space-2); font-size: var(--text-caption); color: var(--muted); }

.track {
  height: 3px;
  border-radius: var(--radius-pill);
  background: var(--fill-subtle);
  overflow: hidden;
  margin-top: var(--space-4);
}
.track__bar {
  display: block;
  height: 100%;
  width: 34%;
  border-radius: inherit;
  background: var(--accent);
  opacity: 0.55;
  transform: translateX(-120%);
  animation: slide 1.6s var(--ease-standard) infinite;
}
@keyframes slide {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(380%); }
}
body[data-state="ready"] .track__bar {
  width: 100%;
  transform: none;
  animation: none;
  background: var(--success);
  opacity: 1;
}
body[data-state="timeout"] .track__bar {
  width: 100%;
  transform: none;
  animation: none;
  background: var(--warning);
  opacity: 0.5;
}

/* -------------------------------------------------------------------------- */
/* 动作                                                                      */
/* -------------------------------------------------------------------------- */

.actions {
  margin-top: var(--space-6);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--space-3);
}

.btn {
  font: inherit;
  font-size: var(--text-body-sm);
  min-height: 42px;
  padding: 9px 20px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--outline-strong);
  background: var(--fill-secondary);
  color: var(--ink-2);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-standard),
              color var(--dur-fast) var(--ease-standard),
              border-color var(--dur-fast) var(--ease-standard),
              box-shadow var(--dur-fast) var(--ease-standard),
              filter var(--dur-fast) var(--ease-standard);
}
.btn:hover { background: var(--surface-hover); color: var(--ink); }
.btn:active { transform: translateY(1px); }

.btn--primary { color: var(--ink-2); }
body[data-state="ready"] .btn--primary {
  background: var(--accent);
  border-color: transparent;
  color: var(--accent-ink);
  font-weight: 600;
  box-shadow: 0 10px 28px rgba(255, 90, 82, 0.28);
}
body[data-state="ready"] .btn--primary:hover {
  background: var(--accent);
  color: var(--accent-ink);
  filter: brightness(1.07);
}

.actions__timeout { display: flex; gap: var(--space-3); }
.actions__timeout .btn { flex: 1 1 0; }

/* -------------------------------------------------------------------------- */
/* 提示 / 底部                                                               */
/* -------------------------------------------------------------------------- */

.tips {
  list-style: none;
  margin: var(--space-6) 0 0;
  padding: var(--space-5) 0 0;
  border-top: 1px solid var(--outline);
  display: grid;
  gap: var(--space-3);
}
.tip {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  font-size: var(--text-caption);
  color: var(--muted);
  line-height: 1.55;
}
.tip__dot {
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--outline-strong);
  margin-top: 0.58em;
}

.foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  margin-top: var(--space-5);
  font-size: var(--text-caption);
  color: var(--muted);
}
.foot__addr { color: var(--ink-2); }
.foot__link {
  color: var(--ink-2);
  text-decoration: underline;
  text-underline-offset: 0.2em;
  border-radius: 4px;
}
.foot__link:hover { color: var(--ink); }

.noscript {
  max-width: 448px;
  margin: 16px auto 0;
  text-align: center;
  font-size: var(--text-caption);
  color: var(--muted);
}
.noscript a { color: var(--ink-2); }

/* -------------------------------------------------------------------------- */
/* 无障碍：减少动态                                                          */
/* -------------------------------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
  .pulse::after { animation: none; opacity: 0; }
  .track__bar { animation: none; transform: none; width: 100%; opacity: 0.3; }
  body[data-state="ready"] .track__bar { opacity: 1; }
  body[data-state="timeout"] .track__bar { opacity: 0.5; }
  .btn, .pulse__core { transition: none; }
  .btn:active { transform: none; }
}
</style>
</head>
<body data-state="waiting">
<main class="wrap">
  <section class="card" aria-labelledby="brandName">
    <header class="brand">
      <span class="mark" aria-hidden="true">K</span>
      <span class="brand__text">
        <span class="brand__name" id="brandName">KERNEL</span>
        <span class="brand__ver mono">v0.5.0</span>
      </span>
    </header>
    <p class="tagline">个人事务内核 · 本地优先</p>

    <div class="status">
      <div class="status__head">
        <span class="pulse" aria-hidden="true"><span class="pulse__core"></span></span>
        <p class="status__text" id="statusText" role="status" aria-live="polite">正在启动…首次启动约需 10–30 秒</p>
      </div>
      <p class="status__hint" id="statusHint" hidden>先看看启动窗口里有没有报错，然后再试一次。</p>
      <div class="track" aria-hidden="true"><span class="track__bar"></span></div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="enterBtn">进入 KERNEL</button>
      <div class="actions__timeout" id="timeoutActions" hidden>
        <button type="button" class="btn" id="retryBtn">重试</button>
        <button type="button" class="btn" id="waitBtn">再等一下</button>
      </div>
    </div>

    <ul class="tips">
      <li class="tip"><span class="tip__dot" aria-hidden="true"></span>AI 功能需要你自己的 DeepSeek API Key（进入后：设置 → AI 集成）</li>
      <li class="tip"><span class="tip__dot" aria-hidden="true"></span>所有数据只保存在你本机，不会上传</li>
      <li class="tip"><span class="tip__dot" aria-hidden="true"></span>关闭启动窗口即停止运行</li>
    </ul>

    <footer class="foot">
      <span class="foot__addr mono" id="addr">127.0.0.1:5173</span>
      <a class="foot__link" id="manualLink" href="http://127.0.0.1:5173/">手动进入</a>
    </footer>
  </section>
</main>

<noscript>
  <p class="noscript">请在浏览器打开 <a href="http://127.0.0.1:5173/">http://127.0.0.1:5173/</a></p>
</noscript>

<script>
(function () {
  'use strict';

  /* ---- 参数（测试钩子）：?port=5273 覆盖轮询端口；?delay=0 禁用自动跳转 ---- */
  var params = new URLSearchParams(window.location.search);
  var DEFAULT_PORT = 5173;
  var port = DEFAULT_PORT;
  var rawPort = parseInt(params.get('port'), 10);
  if (Number.isFinite(rawPort) && rawPort >= 1 && rawPort <= 65535) port = rawPort;
  var appUrl = 'http://127.0.0.1:' + port + '/';

  var autoDelay = 1000;
  var autoDisabled = false;
  var rawDelay = params.get('delay');
  if (rawDelay !== null) {
    var d = Number(rawDelay);
    if (Number.isFinite(d) && d >= 0) {
      autoDelay = d;
      autoDisabled = d === 0;
    }
  }

  var POLL_INTERVAL_MS = 800;
  var PROBE_TIMEOUT_MS = 4000;
  var TIMEOUT_MS = 120000;

  var body = document.body;
  var statusText = document.getElementById('statusText');
  var statusHint = document.getElementById('statusHint');
  var enterBtn = document.getElementById('enterBtn');
  var timeoutActions = document.getElementById('timeoutActions');
  var retryBtn = document.getElementById('retryBtn');
  var waitBtn = document.getElementById('waitBtn');
  var addr = document.getElementById('addr');
  var manualLink = document.getElementById('manualLink');

  addr.textContent = '127.0.0.1:' + port;
  manualLink.href = appUrl;

  var state = 'waiting';
  var startedAt = Date.now();
  var timer = null;
  var autoTimer = null;

  function setStatus(text) {
    if (statusText.textContent !== text) statusText.textContent = text;
  }

  function render() {
    body.dataset.state = state;
    if (state === 'ready') {
      setStatus('已就绪，马上进入…');
      statusHint.hidden = true;
      enterBtn.hidden = false;
      timeoutActions.hidden = true;
    } else if (state === 'timeout') {
      setStatus('还没起来');
      statusHint.hidden = false;
      enterBtn.hidden = true;
      timeoutActions.hidden = false;
    } else {
      setStatus('正在启动…首次启动约需 10–30 秒');
      statusHint.hidden = true;
      enterBtn.hidden = false;
      timeoutActions.hidden = true;
    }
  }

  /* 探活：no-cors 不透明响应；resolve 视为就绪，网络错误 / 超时视为未就绪 */
  function probe() {
    return new Promise(function (resolve) {
      var settled = false;
      var ctrl = new AbortController();
      var to = setTimeout(function () {
        if (settled) return;
        settled = true;
        try { ctrl.abort(); } catch (e) { /* 忽略 */ }
        resolve(false);
      }, PROBE_TIMEOUT_MS);

      fetch(appUrl, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
        .then(function () {
          if (settled) return;
          settled = true;
          clearTimeout(to);
          resolve(true);
        })
        .catch(function () {
          if (settled) return;
          settled = true;
          clearTimeout(to);
          resolve(false);
        });
    });
  }

  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(tick, ms);
  }

  function tick() {
    if (state !== 'waiting') return;
    probe().then(function (ok) {
      if (state !== 'waiting') return;
      if (ok) { setState('ready'); return; }
      if (Date.now() - startedAt >= TIMEOUT_MS) { setState('timeout'); return; }
      schedule(POLL_INTERVAL_MS);
    });
  }

  function setState(next) {
    state = next;
    render();
    if (next === 'ready' && !autoDisabled && !autoTimer) {
      autoTimer = setTimeout(function () { window.location.replace(appUrl); }, autoDelay);
    }
  }

  function startWaiting() {
    state = 'waiting';
    startedAt = Date.now();
    autoTimer = null;
    render();
    schedule(0);
  }

  function go() { window.location.href = appUrl; }

  enterBtn.addEventListener('click', go);
  manualLink.addEventListener('click', function (e) {
    e.preventDefault();
    go();
  });
  retryBtn.addEventListener('click', startWaiting);
  waitBtn.addEventListener('click', startWaiting);

  render();
  schedule(0);
})();
</script>
</body>
</html>
